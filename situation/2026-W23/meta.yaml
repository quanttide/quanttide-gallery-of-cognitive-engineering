id: f6a7b8c9-d0e1-2345-fabc-456789012345
name: meta
label: 元
content:
  agenda: 通过合并冗余领域、统一命名规范、明确 1.0 标准，降低系统维护负担，将标准化沉淀为元智能的自然产出。
  ecology: 标准化职能被合并回元职能、缩写从三套规则归并为两套、边界稳定清晰作为 1.0 标志、元智能成熟度直接体现系统成熟度。
  frame: 将标准化理解为元智能成熟度的自然产出而非一次性工作——标准化的终点不是规则文档，而是系统自我维护的元能力。
  dynamics: 从标准化职能的归属问题出发，经过缩写规则归并的具体操作，收敛到 1.0 标准的定义，是一个完整的推理链条。
