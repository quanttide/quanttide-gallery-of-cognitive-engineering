id: e5f6a7b8-c9d0-1234-efab-345678901219
name: innov
label: 创新管理
content:
  agenda: 在认知尚未收敛的阶段通过追求表达速度和重构中的涌现来替代传统的前置系统设计，加速框架成型。
  ecology: "把阻碍当需求"原则确立、"原来这就是涌现"的认知突破、"更快出来反复改"的方法论形成、自我繁殖和自我增长的系统愿景、意图识别的难题暴露。
  frame: 将研发探索理解为涌现驱动的元方法论——框架不在设计时确定而在重构中涌现，表达速度优先于系统设计，阻碍本身就是需求的来源。
  dynamics: 从把阻碍当需求的认识到涌现的突破发现，再到追求更快出来反复改的原则，最后到自我繁殖和自我增长的系统愿景。
