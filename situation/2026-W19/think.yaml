id: d4e5f6a7-b8c9-0123-defa-234567890119
name: think
label: 认知工程
content:
  agenda: 建立以二阶控制论为框架的认知工程方法论，将观察置于干预之前，让 AI 理解人类意图，加速认知收敛。
  ecology: 二阶控制论（原控制/控制规则）被智谱点醒、从细节到全貌的认知断裂被识别、人类工作从执行变为观察和提供思路、AI 负责解决具体问题。
  frame: 将认知工程理解为对人类思考方式提供"原规则"——二阶控制论是理论框架，潜意识挖掘是实践方向，从细节到全貌的断裂是待解决的结构性挑战。
  dynamics: 从二阶控制论的理论突破到潜意识挖掘的实践转向，再到从细节到全貌断裂的结构性反思，认知从不自觉的实践上升到有意识的元认知。
