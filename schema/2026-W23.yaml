- id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
  label: 低门槛验证
  usage: 适用于产品经理和创业者评估新想法时参考
  entities:
    - name: 新想法
      attributes:
        - 可行性
        - 门槛
    - name: 验证手段
      attributes:
        - POC
        - 章程
        - 原型
  causals:
    - condition: 新想法通过低门槛验证
      outcome: 可行后结构化复制
    - condition: 验证失败
      outcome: 低成本放弃
  boundaries:
    - 适用于商业和研发探索
    - 排除高投入长期项目
    - 验证周期不超过两周
  properties:
    - key: 验证成本
      value: 低
    - key: 复制效率
      value: 高
  mappings:
    - intent: 探索新商业模式
      action: 做POC验证
    - intent: 降低风险
      action: 先小规模试错
  biases:
    - id: b1c2d3e4-f5a6-7890-bcde-f12345678901
      belief: 所有想法都值得先投入
      fact: 低门槛验证可快速筛选无效想法
    - id: b1c2d3e4-f5a6-7890-bcde-f12345678902
      belief: 验证成功就等于有商业价值
      fact: 验证成功只是技术可行，商业价值需要独立评估

