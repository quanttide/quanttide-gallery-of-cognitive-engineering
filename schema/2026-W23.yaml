- id: c3d4e5f6-a7b8-9012-ef34-567890123456
  label: 体系化治理
  usage: 适用于技术负责人设计基础设施策略时参考
  entities:
    - name: 基础设施
      attributes:
        - 备份策略
        - 工具链归属
        - 架构边界
    - name: 治理体系
      attributes:
        - 标准化
        - 自动化
        - 分工
  causals:
    - condition: 被动防守备份且工具链归属不清
      outcome: 数据丢失风险和维护负担增加
    - condition: 主动设计体系
      outcome: 安全可靠平台
  boundaries:
    - 适用于多云端环境
    - 排除单机简单场景
    - 需要至少三个实例才进入抽象层
  properties:
    - key: 治理方式
      value: 主动设计
  dynamics:
    - key: 抽象风险
      value: 随复杂度递增
  mappings:
    - intent: 防数据丢失
      action: 建立自动化备份
    - intent: 理清工具链归属
      action: 标准化治理
  biases:
    - id: d3e4f5a6-b7c8-9012-ef45-678901234567
      belief: 备份越多越安全
      fact: 体系化治理比堆叠备份更有效

- id: d4e5f6a7-b8c9-0123-f456-789012345678
  label: 人机协作循环
  usage: 适用于研发团队设计人机协作流程时参考
  entities:
    - name: 人类
      attributes:
        - 洞察供给
        - 反馈质量
    - name: AI
      attributes:
        - 补全能力
        - 整合能力
  causals:
    - condition: 人类提供充足洞察
      outcome: AI有效补全并整合
    - condition: AI整合完成
      outcome: 驱动下一轮上升循环
  boundaries:
    - 适用于研发探索
    - 排除纯机械重复任务
    - 需要AI达到可补全的质量水平
  properties:
    - key: 协作模式
      value: 人机互补
  dynamics:
    - key: 循环速度
      value: 随自动化程度提升
  mappings:
    - intent: 快速发现洞察
      action: 启动POC，AI作为补全器
    - intent: 维持低耗能产出
      action: 依赖AI自动化，人类仅提供方向
  biases:
    - id: e4f5a6b7-c8d9-0123-f567-890123456789
      belief: AI可完全替代人类洞察
      fact: 人类反馈是打破AI局部最优的关键
    - id: e4f5a6b7-c8d9-0123-f567-890123456788
      belief: AI整合完成后人类可以彻底退出
      fact: AI整合完成仍需人类审阅把关

